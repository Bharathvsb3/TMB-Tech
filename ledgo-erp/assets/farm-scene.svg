<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Illustration of rolling farm fields with a sun, clouds, and a silo">
  <title>LedGo ERP — Farm Scene</title>
  <defs>
    <symbol id="cropPlant" viewBox="0 0 20 34">
      <path d="M10 34V15" stroke="#1B693D" stroke-width="2.4" stroke-linecap="round" />
      <path d="M10 21c-6-3-8-9-6-15" stroke="#2E9B5C" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M10 17c6-3 8-9 6-15" stroke="#2E9B5C" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </symbol>
  </defs>

  <!-- sun -->
  <circle cx="130" cy="55" r="46" fill="#2E9B5C" opacity="0.28" />
  <circle cx="130" cy="55" r="24" fill="#2E9B5C" />

  <!-- clouds -->
  <g fill="#9AA5B3" opacity="0.5">
    <ellipse cx="500" cy="42" rx="42" ry="15" />
    <ellipse cx="533" cy="35" rx="27" ry="13" />
    <ellipse cx="475" cy="36" rx="22" ry="11" />
  </g>
  <g fill="#9AA5B3" opacity="0.4">
    <ellipse cx="660" cy="66" rx="34" ry="12" />
    <ellipse cx="684" cy="60" rx="21" ry="10" />
  </g>

  <!-- silo -->
  <g>
    <rect x="628" y="86" width="42" height="76" rx="8" fill="#1A2431" stroke="#33404F" />
    <path d="M624 86 L649 64 L674 86 Z" fill="#2E9B5C" />
  </g>

  <!-- rolling fields -->
  <path d="M0 138 Q100 118 200 136 T400 134 T600 138 T800 132 V200 H0 Z" fill="#2E9B5C" opacity="0.18" />
  <path d="M0 162 Q120 144 260 160 T520 158 T800 164 V200 H0 Z" fill="#2E9B5C" opacity="0.32" />

  <!-- crop row -->
  <use href="#cropPlant" x="30" y="168" width="18" height="30" />
  <use href="#cropPlant" x="68" y="170" width="18" height="30" />
  <use href="#cropPlant" x="106" y="167" width="18" height="30" />
  <use href="#cropPlant" x="144" y="171" width="18" height="30" />
  <use href="#cropPlant" x="182" y="168" width="18" height="30" />
  <use href="#cropPlant" x="220" y="172" width="18" height="30" />
  <use href="#cropPlant" x="258" y="169" width="18" height="30" />
  <use href="#cropPlant" x="296" y="173" width="18" height="30" />
  <use href="#cropPlant" x="334" y="170" width="18" height="30" />
  <use href="#cropPlant" x="372" y="174" width="18" height="30" />
</svg>
